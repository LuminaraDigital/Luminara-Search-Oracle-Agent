- name: escalate-stops-when-first-passes
  kind: high_accuracy_schema
  siteHost: acme.example
  expectedType: Organization
  strategy: escalate
  candidate0: |
    {"@context":"https://schema.org","@type":"Organization","name":"Acme","url":"https://acme.example/"}
  candidate1: |
    {"@context":"https://schema.org","@type":"Organization","name":"Unused","url":"https://acme.example/"}
  expect:
    winnerIndex: 0
    calls: 1
    mustContain:
      - Acme

- name: escalate-selects-second-after-missing-name
  kind: high_accuracy_schema
  siteHost: acme.example
  expectedType: Organization
  strategy: escalate
  candidate0: |
    {"@context":"https://schema.org","@type":"Organization","url":"https://acme.example/"}
  candidate1: |
    {"@context":"https://schema.org","@type":"Organization","name":"Acme Fountains","url":"https://acme.example/about"}
  expect:
    winnerIndex: 1
    calls: 2
    reason: MISSING_Organization_name
    mustContain:
      - Acme Fountains

- name: parallel-lowest-index-wins
  kind: high_accuracy_schema
  siteHost: acme.example
  expectedType: Organization
  strategy: parallel
  candidate0: |
    {"@context":"https://schema.org","@type":"Organization","name":"First","url":"https://acme.example/"}
  candidate1: |
    {"@context":"https://schema.org","@type":"Organization","name":"Second","url":"https://acme.example/"}
  expect:
    winnerIndex: 0
    calls: 2

