- name: product-needs-offer-review-or-rating
  kind: high_accuracy_schema
  siteHost: acme.example
  expectedType: Product
  strategy: escalate
  candidate0: |
    {"@context":"https://schema.org","@type":"Product","name":"Widget","url":"https://acme.example/widget"}
  candidate1: |
    {"@context":"https://schema.org","@type":"Product","name":"Widget","url":"https://acme.example/widget","offers":{"@type":"Offer","price":"12","priceCurrency":"USD"}}
  expect:
    winnerIndex: 1
    calls: 2
    reason: MISSING_Product_offers|review|aggregateRating

- name: script-breakout-rejected
  kind: high_accuracy_schema
  siteHost: acme.example
  expectedType: Organization
  strategy: escalate
  candidate0: |
    {"@context":"https://schema.org","@type":"Organization","name":"Acme </script>","url":"https://acme.example/"}
  expect:
    winnerIndex: none
    calls: 1
    reason: SCRIPT_BREAKOUT
