appId: digital.luminara.suite
productName: Luminara Suite
copyright: Copyright © Luminara Digital
directories:
  output: release
  buildResources: build
files:
  - electron/**/*
  - package.json
  - build/icon.png
asar: true
compression: maximum
extraMetadata:
  main: electron/main.cjs
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Luminara-Suite-Setup-${version}.${ext}
  executableName: LuminaraSuite
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Luminara Suite
  deleteAppDataOnUninstall: false
# Publish config is required so electron-builder emits latest.yml / blockmap metadata
# for electron-updater. CI still passes --publish never and uploads via softprops.
publish:
  - provider: github
    owner: LuminaraDigital
    repo: Luminara-Search-Oracle-Agent
    releaseType: release
