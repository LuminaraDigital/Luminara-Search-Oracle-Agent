appId: digital.luminara.suite
productName: Luminara Suite
copyright: Copyright © Luminara Digital
directories:
  output: release
  buildResources: build
files:
  - electron/**/*
  - package.json
  - build/icon.png
asar: true
compression: maximum
extraMetadata:
  main: electron/main.cjs
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Luminara-Suite-Setup-${version}.${ext}
  executableName: LuminaraSuite
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Luminara Suite
  deleteAppDataOnUninstall: false
# Publishing is handled by GitHub Actions (softprops/action-gh-release) so the
# release tag stays desktop-v*, matching the workflow trigger. Do not let
# electron-builder create a conflicting v{version} release.
publish: null
