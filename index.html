<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Luminara Suite | AI Search &amp; AEO Intelligence</title>
  <meta name="description" content="Luminara Suite audits how your brand shows up in Google, AI Overviews, ChatGPT and Perplexity, then turns the findings into a prioritized action plan.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="Luminara Suite | AI Search &amp; AEO Intelligence">
  <meta property="og:description" content="SEO, AEO and GEO audits grounded in live search results, with a plain-English action plan.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.luminarasuite.com/">
  <meta property="og:image" content="https://www.luminarasuite.com/icon-512.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" href="/icon-180.png" sizes="180x180">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #BF953F;
      --gold-light: #FCF6BA;
      --gold-dark: #AA771C;
      --surface: #000000;
      --surface-1: #0a0a0a;
      --ink: #f1f1f1;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #000000;
      color: #f1f1f1;
    }
    .luminara-gradient {
      background: linear-gradient(135deg, var(--gold), var(--gold-light), #B38728, #FBF5B7, var(--gold-dark));
    }
    .gold-text {
      background: linear-gradient(135deg, var(--gold), var(--gold-light), #B38728);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      padding-bottom: 0.1em;
      margin-bottom: -0.1em;
      line-height: 1.2;
      display: inline-block;
    }
    .glass-morphism {
      background: rgba(15, 15, 15, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(191, 149, 63, 0.2);
    }
    .gold-glow {
      box-shadow: 0 0 20px rgba(191, 149, 63, 0.15);
    }
    
    @keyframes title-shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .animate-title-shimmer {
      background: linear-gradient(90deg, var(--gold), var(--gold-light), #B38728, #FBF5B7, var(--gold-dark), var(--gold-light), var(--gold));
      background-size: 300% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: title-shimmer 8s linear infinite;
    }
    .title-pronounced {
      animation-duration: 2s;
      filter: drop-shadow(0 0 12px rgba(252, 246, 186, 0.4));
    }

    /* Professional Markdown Rendering Styles */
    .markdown-content {
      line-height: 1.8;
      font-size: 1rem;
      color: #e5e7eb;
      max-width: 850px;
    }
    .markdown-content h1 {
      font-size: 2.25rem;
      font-weight: 600;
      color: var(--gold-light);
      margin-top: 0;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }
    .markdown-content h2 {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--gold);
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(191, 149, 63, 0.15);
      padding-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .markdown-content h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--gold);
      margin-top: 2rem;
      margin-bottom: 0.75rem;
    }
    .markdown-content p {
      margin-bottom: 1.5rem;
    }
    .markdown-content table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 2.5rem 0;
      border: 1px solid rgba(191, 149, 63, 0.2);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.02);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .markdown-content th {
      text-align: left;
      padding: 1.25rem 1rem;
      background: rgba(191, 149, 63, 0.1);
      color: var(--gold-light);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      border-bottom: 1px solid rgba(191, 149, 63, 0.2);
    }
    .markdown-content td {
      padding: 1.25rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #d1d1d1;
      font-size: 0.95rem;
    }
    .markdown-content tr:last-child td {
      border-bottom: none;
    }
    .markdown-content tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.01);
    }
    .markdown-content ul, .markdown-content ol {
      margin-bottom: 1.5rem;
      padding-left: 2rem;
    }
    .markdown-content li {
      margin-bottom: 0.75rem;
      position: relative;
    }
    .markdown-content ul li::before {
      content: "";
      position: absolute;
      left: -1.25rem;
      top: 0.65rem;
      width: 6px;
      height: 6px;
      background: var(--gold);
      border-radius: 50%;
    }
    .markdown-content blockquote {
      border-left: 4px solid var(--gold);
      background: rgba(191, 149, 63, 0.05);
      padding: 1.5rem 2rem;
      margin: 2rem 0;
      font-style: italic;
      color: #9ca3af;
      border-radius: 0 8px 8px 0;
    }
    .markdown-content hr {
      border: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(191, 149, 63, 0.3), transparent);
      margin: 3rem 0;
    }

    /* Audit-Specific Classes */
    .impact-high {
      background: rgba(191, 149, 63, 0.2);
      color: var(--gold-light);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
      border: 1px solid var(--gold);
    }
    .impact-med {
      background: rgba(255, 255, 255, 0.1);
      color: #d1d1d1;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    code {
      background: rgba(255, 255, 255, 0.05);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--gold-light);
      font-size: 0.85em;
    }
    pre {
      background: #0a0a0a;
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid rgba(191, 149, 63, 0.15);
      overflow-x: auto;
      margin: 2rem 0;
      box-shadow: inset 0 2px 20px rgba(0,0,0,0.6);
    }

    .interactive-logo {
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .interactive-logo:hover {
      transform: scale(1.1) rotate(5deg);
      filter: drop-shadow(0 0 15px rgba(191, 149, 63, 0.6));
    }
    
    @keyframes orbit-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .logo-orbit {
      transform-origin: center;
      animation: orbit-rotate 20s linear infinite;
    }
    .logo-thinking .logo-orbit {
      animation-duration: 4s;
    }
    .logo-voice .logo-orbit {
      animation-duration: 1.5s;
    }
    
    @keyframes core-pulse-gold {
      0%, 100% { 
        transform: scale(1); 
        filter: brightness(1) drop-shadow(0 0 5px rgba(191, 149, 63, 0.3)); 
      }
      50% { 
        transform: scale(1.12); 
        filter: brightness(1.25) drop-shadow(0 0 15px rgba(252, 246, 186, 0.8)); 
      }
    }

    @keyframes voice-shimmer-rapid {
      0%, 100% { 
        transform: scale(1.1); 
        filter: brightness(1.2) drop-shadow(0 0 10px rgba(191, 149, 63, 0.5)); 
      }
      25% { transform: scale(1.2); filter: brightness(1.8); }
      50% { transform: scale(1.05); filter: brightness(2.5) drop-shadow(0 0 25px rgba(252, 246, 186, 1)); }
      75% { transform: scale(1.3); filter: brightness(1.6); }
    }

    @keyframes orbit-glint {
      0%, 100% { opacity: 0.4; stroke-width: 0.7; }
      50% { opacity: 1; stroke-width: 1.8; filter: brightness(1.8) drop-shadow(0 0 12px var(--gold-light)); }
    }
    
    .logo-core {
      transform-origin: center;
    }
    
    .logo-thinking .logo-core {
      animation: core-pulse-gold 1.2s ease-in-out infinite;
    }
    
    .logo-voice .logo-core {
      animation: voice-shimmer-rapid 0.12s linear infinite;
    }

    .logo-voice .logo-orbit ellipse {
      animation: orbit-glint 0.4s ease-in-out infinite;
    }

    .streaming-cursor {
      display: inline-block;
      width: 5px;
      height: 15px;
      background: linear-gradient(180deg, rgba(191, 149, 63, 0.4) 0%, rgba(191, 149, 63, 0.8) 100%);
      margin-left: 6px;
      vertical-align: text-bottom;
      border-radius: 1px;
      animation: cursor-gold-pulse 1.8s ease-in-out infinite;
    }
    
    @keyframes cursor-gold-pulse {
      0%, 100% { 
        opacity: 0.15; 
        transform: scaleY(0.95);
        box-shadow: 0 0 2px rgba(191, 149, 63, 0.05);
      }
      50% { 
        opacity: 0.5; 
        transform: scaleY(1);
        box-shadow: 0 0 10px rgba(191, 149, 63, 0.25);
      }
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); opacity: 0; }
      5% { opacity: 0.2; }
      95% { opacity: 0.2; }
      100% { transform: translateY(100%); opacity: 0; }
    }
    .hologram-scan {
      position: absolute;
      top: 0; left: 0; right: 0; height: 100%;
      background: linear-gradient(180deg, transparent, rgba(191, 149, 63, 0.05), rgba(191, 149, 63, 0.2), rgba(191, 149, 63, 0.05), transparent);
      animation: scanline 4s linear infinite;
      pointer-events: none;
      z-index: 50;
    }

    @keyframes progress-shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .progress-gold {
      background: linear-gradient(90deg, var(--gold-dark), var(--gold-light), var(--gold), var(--gold-light), var(--gold-dark));
      background-size: 200% auto;
      animation: progress-shimmer 2s linear infinite;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #2a2a2a;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--gold);
    }
    @keyframes pulse-custom {
      0%, 100% { transform: scaleY(1); opacity: 0.5; }
      50% { transform: scaleY(2.5); opacity: 1; }
    }
    .wave-bar {
      animation: pulse-custom 0.8s ease-in-out infinite;
    }
  </style>
</head>
<body class="overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
