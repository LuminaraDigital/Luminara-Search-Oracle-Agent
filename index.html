  <style>
    @font-face {
      font-family: 'Outfit';

      font-weight: 100 900;
      font-display: swap;
      src: url('/fonts/outfit-latin.woff2') format('woff2');

    }
    @font-face {
      font-family: 'Instrument Serif';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/instrument-serif-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Instrument Serif';
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/instrument-serif-italic-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    :root {
      --gold: #BF953F;
      --gold-light: #FCF6BA;
      --gold-dark: #AA771C;
      --surface: #000000;
      --surface-1: #0a0a0a;
      --ink: #f1f1f1;
      /* shortcut: mirrors tokens.css so the hero can paint before the deferred bundle */
      --color-ink: oklch(96.8% 0.004 90);
      --color-accent: oklch(69.3% 0.114 82.6);
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-body: 'Outfit', ui-sans-serif, system-ui, sans-serif;
    }
    body {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      background-color: #000000;
      color: #f1f1f1;
    }
    .font-display {
      font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif;
    }
    .luminara-gradient {
      background: linear-gradient(135deg, var(--gold), var(--gold-light), #B38728, #FBF5B7, var(--gold-dark));
    }
    .gold-text {
      background: linear-gradient(135deg, var(--gold), var(--gold-light), #B38728);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      padding-bottom: 0.1em;
      margin-bottom: -0.1em;
      line-height: 1.2;
      display: inline-block;
    }
    /* Legacy class name. design.md bans glass: this is now a solid token surface. */
    .glass-morphism {
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
    }
    .glass-premium {
      background: linear-gradient(160deg, rgba(191,149,63,0.08), rgba(10,10,10,0.82) 38%, rgba(0,0,0,0.9));
      backdrop-filter: blur(28px) saturate(1.2);
      -webkit-backdrop-filter: blur(28px) saturate(1.2);
      border: 1px solid rgba(191, 149, 63, 0.28);
      box-shadow:
        0 30px 80px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(252, 246, 186, 0.08);
    }
    .gold-glow {
      box-shadow: 0 0 28px rgba(191, 149, 63, 0.18);
    }
    .premium-hairline {
      background: linear-gradient(90deg, transparent, rgba(191,149,63,0.45), transparent);
    }
    
    @keyframes title-shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .animate-title-shimmer {
      background: linear-gradient(90deg, var(--gold), var(--gold-light), #B38728, #FBF5B7, var(--gold-dark), var(--gold-light), var(--gold));
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: title-shimmer 8s linear infinite;
    }
    @keyframes premium-drift {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(4%, -3%, 0) scale(1.06); }
    }
    @keyframes premium-drift-slow {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-5%, 4%, 0) scale(1.08); }
    }
    .animate-premium-drift {
      animation: premium-drift 18s ease-in-out infinite;
    }
    .animate-premium-drift-slow {
      animation: premium-drift-slow 26s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .animate-premium-drift,
      .animate-premium-drift-slow,
      .animate-title-shimmer {
        animation: none !important;
      }
    }
    .title-pronounced {
      animation-duration: 2s;
      filter: drop-shadow(0 0 12px rgba(252, 246, 186, 0.4));
    }

    /* Professional Markdown Rendering Styles */
    .markdown-content {
      line-height: 1.8;
      font-size: 1rem;
      color: #e5e7eb;
      max-width: 850px;
    }
    .markdown-content h1 {
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      font-weight: 600;
      color: var(--gold-light);
      margin-top: 0;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
      overflow-wrap: anywhere;
    }
    .markdown-content h2 {
      font-size: clamp(1.15rem, 3.5vw, 1.5rem);
      font-weight: 600;
      color: var(--gold);
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(191, 149, 63, 0.15);
      padding-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      overflow-wrap: anywhere;
    }
    .markdown-content h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--gold);
      margin-top: 2rem;
      margin-bottom: 0.75rem;
    }
    .markdown-content p {
      margin-bottom: 1.5rem;
    }
    .markdown-content table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 2.5rem 0;
      border: 1px solid rgba(191, 149, 63, 0.2);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.02);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      display: block;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    @media (max-width: 640px) {
      .markdown-content th,
      .markdown-content td {
        padding: 0.85rem 0.75rem;
        font-size: 0.85rem;
      }
      .markdown-content ul, .markdown-content ol {
        padding-left: 1.25rem;
      }
    }
    .markdown-content th {
      text-align: left;
      padding: 1.25rem 1rem;
      background: rgba(191, 149, 63, 0.1);
      color: var(--gold-light);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      border-bottom: 1px solid rgba(191, 149, 63, 0.2);
    }
    .markdown-content td {
      padding: 1.25rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #d1d1d1;
      font-size: 0.95rem;
    }
    .markdown-content tr:last-child td {
      border-bottom: none;
    }
    .markdown-content tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.01);
    }
    .markdown-content ul, .markdown-content ol {
      margin-bottom: 1.5rem;
      padding-left: 2rem;
    }
    .markdown-content li {
      margin-bottom: 0.75rem;
      position: relative;
    }
    .markdown-content ul li::before {
      content: "";
      position: absolute;
      left: -1.25rem;
      top: 0.65rem;
      width: 6px;
      height: 6px;
      background: var(--gold);
      border-radius: 50%;
    }
    .markdown-content blockquote {
      border-left: 4px solid var(--gold);
      background: rgba(191, 149, 63, 0.05);
      padding: 1.5rem 2rem;
      margin: 2rem 0;
      font-style: italic;
      color: #9ca3af;
      border-radius: 0 8px 8px 0;
    }
    .markdown-content hr {
      border: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(191, 149, 63, 0.3), transparent);
      margin: 3rem 0;
    }

    /* Instant Scout card: full brief, tighter than the long-form report styles above. */
    .markdown-content.scout-brief {
      max-width: 42rem;
      font-size: 0.9375rem;
      line-height: 1.65;
      color: #e5e7eb;
    }
    .markdown-content.scout-brief h1,
    .markdown-content.scout-brief h2,
    .markdown-content.scout-brief h3,
    .markdown-content.scout-brief h4 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--gold-light);
      margin-top: 1.15rem;
      margin-bottom: 0.45rem;
      letter-spacing: -0.01em;
      text-transform: none;
      border: 0;
      padding: 0;
      line-height: 1.35;
    }
    .markdown-content.scout-brief h1:first-child,
    .markdown-content.scout-brief h2:first-child,
    .markdown-content.scout-brief h3:first-child,
    .markdown-content.scout-brief h4:first-child {
      margin-top: 0;
    }
    .markdown-content.scout-brief p {
      margin-bottom: 0.75rem;
    }
    .markdown-content.scout-brief p:last-child {
      margin-bottom: 0;
    }
    .markdown-content.scout-brief ul,
    .markdown-content.scout-brief ol {
      margin: 0.35rem 0 0.85rem;
      padding-left: 1.5rem;
    }
    .markdown-content.scout-brief ol {
      list-style: decimal;
    }
    .markdown-content.scout-brief ul {
      list-style: none;
    }
    .markdown-content.scout-brief li {
      margin-bottom: 0.45rem;
    }
    .markdown-content.scout-brief strong {
      color: #fff;
      font-weight: 600;
    }
    .markdown-content.scout-brief em {
      color: #d1d5db;
    }
    .markdown-content.scout-brief code {
      font-size: 0.92em;
      color: var(--gold-light);
    }

    /* Audit-Specific Classes */
    .impact-high {
      background: rgba(191, 149, 63, 0.2);
      color: var(--gold-light);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
      border: 1px solid var(--gold);
    }
    .impact-med {
      background: rgba(255, 255, 255, 0.1);
      color: #d1d1d1;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    code {
      background: rgba(255, 255, 255, 0.05);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--gold-light);
      font-size: 0.85em;
    }
    pre {
      background: #0a0a0a;
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid rgba(191, 149, 63, 0.15);
      overflow-x: auto;
      margin: 2rem 0;
      box-shadow: inset 0 2px 20px rgba(0,0,0,0.6);
    }

    .interactive-logo {
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .interactive-logo:hover {
      transform: scale(1.1) rotate(5deg);
      filter: drop-shadow(0 0 15px rgba(191, 149, 63, 0.6));
    }
    
    @keyframes orbit-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .logo-orbit {
      transform-origin: center;
      animation: orbit-rotate 20s linear infinite;
    }
    .logo-thinking .logo-orbit {
      animation-duration: 4s;
    }
    .logo-voice .logo-orbit {
      animation-duration: 1.5s;
    }
    
    @keyframes core-pulse-gold {
      0%, 100% { 
        transform: scale(1); 
        filter: brightness(1) drop-shadow(0 0 5px rgba(191, 149, 63, 0.3)); 
      }
      50% { 
        transform: scale(1.12); 
        filter: brightness(1.25) drop-shadow(0 0 15px rgba(252, 246, 186, 0.8)); 
      }
    }

    @keyframes voice-shimmer-rapid {
      0%, 100% { 
        transform: scale(1.1); 
        filter: brightness(1.2) drop-shadow(0 0 10px rgba(191, 149, 63, 0.5)); 
      }
      25% { transform: scale(1.2); filter: brightness(1.8); }
      50% { transform: scale(1.05); filter: brightness(2.5) drop-shadow(0 0 25px rgba(252, 246, 186, 1)); }
      75% { transform: scale(1.3); filter: brightness(1.6); }
    }

    @keyframes orbit-glint {
      0%, 100% { opacity: 0.4; stroke-width: 0.7; }
      50% { opacity: 1; stroke-width: 1.8; filter: brightness(1.8) drop-shadow(0 0 12px var(--gold-light)); }
    }
    
    .logo-core {
      transform-origin: center;
    }
    
    .logo-thinking .logo-core {
      animation: core-pulse-gold 1.2s ease-in-out infinite;
    }
    
    .logo-voice .logo-core {
      animation: voice-shimmer-rapid 0.12s linear infinite;
    }

    .logo-voice .logo-orbit ellipse {
      animation: orbit-glint 0.4s ease-in-out infinite;
    }

    .streaming-cursor {
      display: inline-block;
      width: 5px;
      height: 15px;
      background: linear-gradient(180deg, rgba(191, 149, 63, 0.4) 0%, rgba(191, 149, 63, 0.8) 100%);
      margin-left: 6px;
      vertical-align: text-bottom;
      border-radius: 1px;
      animation: cursor-gold-pulse 1.8s ease-in-out infinite;
    }
    
    @keyframes cursor-gold-pulse {
      0%, 100% { 
        opacity: 0.15; 
        transform: scaleY(0.95);
        box-shadow: 0 0 2px rgba(191, 149, 63, 0.05);
      }
      50% { 
        opacity: 0.5; 
        transform: scaleY(1);
        box-shadow: 0 0 10px rgba(191, 149, 63, 0.25);
      }
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); opacity: 0; }
      5% { opacity: 0.2; }
      95% { opacity: 0.2; }
      100% { transform: translateY(100%); opacity: 0; }
    }
    .hologram-scan {
      position: absolute;
      top: 0; left: 0; right: 0; height: 100%;
      background: linear-gradient(180deg, transparent, rgba(191, 149, 63, 0.05), rgba(191, 149, 63, 0.2), rgba(191, 149, 63, 0.05), transparent);
      animation: scanline 4s linear infinite;
      pointer-events: none;
      z-index: 50;
    }

    @keyframes progress-shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .progress-gold {
      background: linear-gradient(90deg, var(--gold-dark), var(--gold-light), var(--gold), var(--gold-light), var(--gold-dark));
      background-size: 200% auto;
      animation: progress-shimmer 2s linear infinite;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #2a2a2a;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--gold);
    }
    @keyframes pulse-custom {
      0%, 100% { transform: scaleY(1); opacity: 0.5; }
      50% { transform: scaleY(2.5); opacity: 1; }
    }
    .wave-bar {
      animation: pulse-custom 0.8s ease-in-out infinite;
    }

    /* Inline boot scene. Stays invisible until boot-splash.js adds --hold after 300ms. */
    .lx-load {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 240px;
      padding: 24px 16px;
      color: #f1f1f1;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      min-height: 100%;
      background: #000;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    #boot-splash.boot-splash--hold { visibility: visible; opacity: 1; pointer-events: auto; }
    #boot-splash.boot-splash--exit { visibility: hidden; opacity: 0; pointer-events: none; }
    .lx-word { margin: 0; height: 28px; font: 400 26px/28px "Instrument Serif", Georgia, serif; color: #FCF6BA; }
    .lx-load--compact .lx-word { height: 24px; font-size: 22px; line-height: 24px; }
    .lx-scene { width: min(320px, 78vw); height: auto; }
    .lx-load--compact .lx-scene { width: min(220px, 70vw); }
    .lx-load--fill { min-height: min(72vh, 640px); }
    .lx-grid { fill: none; stroke: #BF953F; stroke-width: 0.6; opacity: 0.35; transform: translate3d(var(--shift-x, 0px), var(--shift-y, 0px), 0); }
    .lx-line { fill: none; stroke: #FCF6BA; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: lx-draw 1.6s ease forwards 0.12s; }
    .lx-pin { cursor: pointer; animation: lx-drop 0.55s cubic-bezier(0.22, 1, 0.36, 1) 1.05s both; }
    .lx-pin path { fill: #BF953F; }
    .lx-pin-hole { fill: #0a0a0a; }
    .lx-pulse { fill: rgba(191,149,63,0.2); transform-box: fill-box; transform-origin: center; animation: lx-pulse 2.6s ease-in-out infinite 1.5s; }
    .lx-pin:hover .lx-pulse { fill: rgba(252,246,186,0.55); }
    .lx-caption { margin: 0; font: 500 14px/1.45 Outfit, system-ui, sans-serif; color: #e6e6e6; text-align: center; }
    .lx-steps { list-style: none; margin: 0; padding: 0; width: min(320px, 86vw); }
    .lx-steps li { font: 14px/1.45 Outfit, system-ui, sans-serif; color: #c8c8c8; padding: 2px 0; }
    .lx-steps li.is-now { color: #FCF6BA; }
    .lx-steps li.is-done { color: #dedede; }
