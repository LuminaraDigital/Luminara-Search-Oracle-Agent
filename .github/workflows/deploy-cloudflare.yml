name: Multi-Tier Cloudflare Deployment Safeguard

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

# Which job runs (tests/deployWorkflow.test.ts evaluates these conditions):
#   push to staging                         -> deploy_staging only
#   push to main                            -> deploy_production only
#   manual run naming staging, any ref      -> deploy_staging only
#   manual run naming production, from main -> deploy_production only
#   manual run naming production, elsewhere -> refuse_production_off_main (fails, deploys nothing)
# Keep each `if:` on one line: the test reads them as text.

jobs:
  # =========================================================================
  # STAGE 1: Staging Deployment & Automated Validation
  # =========================================================================
  deploy_staging:
    name: Staging Deployment & Pre-Production Smoke Gates
    if: (github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    # One staging deploy at a time. A run that has started is never cancelled: a migrate
    # followed by a deploy must finish. A newer run waits for it.
    concurrency:
      group: cloudflare-deploy-staging
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secrets check
        run: npm run secrets:check

      - name: Validate Staging Environment Schema
        run: node scripts/validate-env.mjs --staging

      - name: Type check
        run: npm run typecheck

      - name: Run automated test suite
        run: npm test

      - name: Build staging bundle
        run: npx vite build --mode staging

      # The restore point. If the migration below goes wrong, this log holds the bookmark to
      # give `wrangler d1 time-travel restore`. No bookmark, no migration: a failure here stops the job.
      - name: Print D1 Time Travel bookmark before migrating (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2373013c66331e9660e47ffa3ae40f5c' }}
        run: npx wrangler d1 time-travel info luminara-users-staging --env staging

      - name: Apply D1 migrations (staging)
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2373013c66331e9660e47ffa3ae40f5c' }}
          command: d1 migrations apply luminara-users-staging --remote --env staging

      - name: Deploy to Cloudflare Workers (Staging Sandbox)
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2373013c66331e9660e47ffa3ae40f5c' }}
          command: deploy --env staging

      - name: Staging Automated Smoke Check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2373013c66331e9660e47ffa3ae40f5c' }}
        run: node scripts/smoke-check.mjs --staging

  # =========================================================================
  # STAGE 2: Production Deployment (Gated by Staging / Main)
  # =========================================================================
  deploy_production:
    name: Production Deployment & Live Verification
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'production'))
    runs-on: ubuntu-latest
    environment: production
    # One production deploy at a time. A run that has started is never cancelled: a migrate
    # followed by a deploy must finish. A newer run waits for it.
    concurrency:
      group: cloudflare-deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history. The release check below reads the merge commit's parents and the tip
          # of origin/staging; the default one-commit checkout has neither.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Production runs only what staging ran. Before anything is installed, migrated or deployed:
      # the commit must be a merge commit whose second parent is the current tip of staging and
      # whose files equal staging's. A squash merge, a direct push, or a merge of anything else
      # stops the job here. A manual run from main is checked the same way.
      - name: Release check (main must be a merge of the staging tip)
        run: |
          git fetch --no-tags --quiet origin +refs/heads/staging:refs/remotes/origin/staging
          node scripts/check-release-merge.mjs --commit HEAD --staging origin/staging

      - name: Install dependencies
        run: npm ci

      - name: Secrets check
        run: npm run secrets:check

      - name: Validate Production Environment Schema
        run: node scripts/validate-env.mjs --prod

      - name: Type check
        run: npm run typecheck

      - name: Run automated test suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      # The restore point. If the migration below goes wrong, this log holds the bookmark to
      # give `wrangler d1 time-travel restore`. No bookmark, no migration: a failure here stops the job.
      - name: Print D1 Time Travel bookmark before migrating (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2373013c66331e9660e47ffa3ae40f5c' }}
        run: npx wrangler d1 time-travel info luminara-users --env production

      - name: Apply D1 migrations (production)
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2373013c66331e9660e47ffa3ae40f5c' }}
          command: d1 migrations apply luminara-users --remote --env production

      - name: Deploy to Cloudflare Workers (Production)
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2373013c66331e9660e47ffa3ae40f5c' }}
          command: deploy --env production

      - name: Production Post-Deploy Smoke Check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2373013c66331e9660e47ffa3ae40f5c' }}
        run: node scripts/smoke-check.mjs --prod

  # =========================================================================
  # A manual run that names production from any ref but main deploys nothing,
  # and fails so the operator sees why instead of a silently skipped run.
  # =========================================================================
  refuse_production_off_main:
    name: Refuse a production deploy from a ref other than main
    if: github.event_name == 'workflow_dispatch' && inputs.target_env == 'production' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "::error title=Production deploys only from main::This run named production from ${GITHUB_REF}. Nothing was deployed. Run the workflow from main."
          exit 1
