name: Multi-Tier Cloudflare Deployment Safeguard

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  # =========================================================================
  # STAGE 1: Staging Deployment & Automated Validation
  # =========================================================================
  deploy_staging:
    name: Staging Deployment & Pre-Production Smoke Gates
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secrets check
        run: npm run secrets:check

      - name: Validate Staging Environment Schema
        run: node scripts/validate-env.mjs --staging

      - name: Type check
        run: npm run typecheck

      - name: Run automated test suite
        run: npm test

      - name: Build staging bundle
        # Staging signs in against its own Firebase project and links to its own bot. The values
        # are public web config, kept as variables of the GitHub "staging" environment. With
        # none set, the staging build shows sign-in as not configured; it never falls back to
        # the production project.
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_TELEGRAM_MINI_APP_URL: ${{ vars.VITE_TELEGRAM_MINI_APP_URL }}
        run: npx vite build --mode staging

      - name: Apply D1 migrations (staging)
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2373013c66331e9660e47ffa3ae40f5c' }}
          command: d1 migrations apply luminara-users-staging --remote --env staging

      - name: Deploy to Cloudflare Workers (Staging Sandbox)
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2373013c66331e9660e47ffa3ae40f5c' }}
          command: deploy --env staging

      - name: Staging Automated Smoke Check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2373013c66331e9660e47ffa3ae40f5c' }}
        run: node scripts/smoke-check.mjs --staging

  # =========================================================================
  # STAGE 2: Production Deployment (Gated by Staging / Main)
  # =========================================================================
  deploy_production:
    name: Production Deployment & Live Verification
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'production')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secrets check
        run: npm run secrets:check

      - name: Validate Production Environment Schema
        run: node scripts/validate-env.mjs --prod

      - name: Type check
        run: npm run typecheck

      - name: Run automated test suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Apply D1 migrations (production)
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2373013c66331e9660e47ffa3ae40f5c' }}
          command: d1 migrations apply luminara-users --remote --env production

      - name: Deploy to Cloudflare Workers (Production)
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2373013c66331e9660e47ffa3ae40f5c' }}
          command: deploy --env production

      - name: Production Post-Deploy Smoke Check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '2373013c66331e9660e47ffa3ae40f5c' }}
        run: node scripts/smoke-check.mjs --prod
