name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Fail if a secret-looking string is in the bundle
        run: |
          if grep -rEq "AIzaSy[A-Za-z0-9_-]{20}|gsk_[A-Za-z0-9]{20}|tvly-[A-Za-z0-9]{10}|nvapi-[A-Za-z0-9_-]{20}|fc-[a-f0-9]{20}" dist/; then
            echo "Key-like string found in dist/"; exit 1; fi
      - name: Worker dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-out
