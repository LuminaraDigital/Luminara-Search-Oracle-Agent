name: CI

on:
  push:
    branches: [main, staging, 'feature/**']
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  verify:
    name: Build, Test & Smoke Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fail if secrets are present in the tree
        run: npm run secrets:check

      - name: Validate environment isolation schema
        run: npm run env:validate

      - name: Type check (Client + Worker)
        run: npm run typecheck

      - name: Automated unit & integration tests
        run: npm test

      - name: Build client bundles (with secret leak guard)
        run: npx vite build

      - name: Fail if a secret-looking string is in the bundle
        run: |
          # Firebase web apiKey (AIza…) is public by design and intentionally ships in dist.
          # Fail only on private provider / cloud credential shapes.
          if grep -rEq "gsk_[A-Za-z0-9]{20}|tvly-[A-Za-z0-9-]{20}|nvapi-[A-Za-z0-9_-]{20}|fc-[a-f0-9]{30}|sk-[A-Za-z0-9_-]{20}|gho_[A-Za-z0-9_]{20}|ghp_[A-Za-z0-9_]{20}|github_pat_[A-Za-z0-9_]{20}|bb_live_[A-Za-z0-9_-]{20}|AKIA[0-9A-Z]{16}" dist/; then
            echo "Key-like string found in dist/"; exit 1; fi

      - name: Automated pre-push bundle smoke check
        run: node scripts/smoke-check.mjs --dry-run

      - name: Worker Staging dry run
        run: npx wrangler deploy --dry-run --env staging --outdir /tmp/wrangler-out-staging

      - name: Worker Production dry run
        run: npx wrangler deploy --dry-run --env production --outdir /tmp/wrangler-out-prod
