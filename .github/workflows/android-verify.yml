name: Android Verification

on:
  push:
    branches: ['**']
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-verify.yml'
      - '.github/workflows/android-release.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-verify.yml'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Grant Execute Permission to Gradlew
        run: chmod +x apps/android/gradlew

      - name: Static Analysis (ktlint, detekt, Android Lint)
        working-directory: apps/android
        run: ./gradlew ktlintCheck detekt lintRelease --no-daemon

      - name: Run Unit Tests
        working-directory: apps/android
        run: ./gradlew test --no-daemon

      - name: Assert Test Count
        working-directory: apps/android
        env:
          MIN_TESTS: '14'
        run: |
          set -euo pipefail
          results=app/build/test-results/testDebugUnitTest
          if [ ! -d "$results" ]; then
            echo "::error::No test results at $results - the suite did not run."
            exit 1
          fi
          total=$(grep -ho 'tests="[0-9]*"' "$results"/*.xml \
            | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          skipped=$(grep -ho 'skipped="[0-9]*"' "$results"/*.xml \
            | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "Executed $total tests ($skipped skipped); floor is $MIN_TESTS."
          if [ "$total" -lt "$MIN_TESTS" ]; then
            echo "::error::Test count $total is below the floor of $MIN_TESTS."
            exit 1
          fi
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped test(s) skipped; the suite must run in full."
            exit 1
          fi

      - name: Build Debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Assemble Instrumented Tests
        working-directory: apps/android
        run: ./gradlew assembleDebugAndroidTest --no-daemon

  minified:
    name: R8 Release Build & Keep Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Grant Execute Permission to Gradlew
        run: chmod +x apps/android/gradlew

      - name: Generate Ephemeral Signing Key
        working-directory: apps/android
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias ci \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass cicicicici -keypass cicicicici \
            -dname "CN=Luminara Suite CI, OU=CI, O=CI, L=CI, S=CI, C=AU"

      - name: Build Release APK (runs R8)
        working-directory: apps/android
        env:
          LUMINARA_KEYSTORE_PASSWORD: cicicicici
          LUMINARA_KEY_ALIAS: ci
          LUMINARA_KEY_PASSWORD: cicicicici
        run: ./gradlew assembleRelease --no-daemon

      - name: Assert R8 Kept Protected Classes
        working-directory: apps/android
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "::error::No release APK at $apk"; exit 1; }
          work=$(mktemp -d)
          unzip -o -q "$apk" 'classes*.dex' -d "$work"
          missing=0
          for descriptor in \
            'Lcom/luminarasuite/app/MainActivity;' \
            'Lcom/luminarasuite/app/core/database/LuminaraDatabase_Impl;' \
            'Lcom/luminarasuite/app/core/model/ProbeCrawlResponse$$serializer;' \
            'Lcom/luminarasuite/app/core/model/GroqChatRequest$$serializer;'
          do
            if ! grep -qa "$descriptor" "$work"/classes*.dex; then
              echo "::error::R8 stripped $descriptor - a keep rule regressed."
              missing=1
            fi
          done
          rm -rf "$work"
          [ "$missing" -eq 0 ] || exit 1
          echo "All protected classes survived R8."

      - name: Report Release APK Size
        working-directory: apps/android
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          bytes=$(stat -c%s "$apk")
          echo "Release APK: $((bytes / 1024)) KiB"
          limit=$((12 * 1024 * 1024))
          if [ "$bytes" -gt "$limit" ]; then
            echo "::error::APK is $((bytes / 1024)) KiB, over the $((limit / 1024)) KiB ceiling."
            exit 1
          fi
