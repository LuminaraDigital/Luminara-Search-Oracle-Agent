name: TON Smart Contract CI

on:
  push:
    branches: [main, staging]
    paths:
      - 'contracts/ton/**'
      - '.github/workflows/ton-ci.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'contracts/ton/**'
      - '.github/workflows/ton-ci.yml'

permissions:
  contents: read

jobs:
  acton-build:
    name: Acton Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e # v1.2.0
        with:
          version: '1.2.0'
          working-directory: contracts/ton

      - name: Build Tolk Contracts
        working-directory: contracts/ton
        run: |
          acton --version
          acton build
