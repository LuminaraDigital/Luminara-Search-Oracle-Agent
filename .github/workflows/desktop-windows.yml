name: Desktop Windows

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Authenticode secrets
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: node scripts/check-desktop-signing.mjs

      - name: Build Windows installer
        env:
          # Authenticode: set repo secrets WIN_CSC_LINK (base64 .pfx) and WIN_CSC_KEY_PASSWORD.
          # When unset, electron-builder ships an unsigned installer (SmartScreen warning expected).
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Keep false unless an Authenticode PFX is provided via WIN_CSC_LINK.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run desktop:dist:win -- --publish never

      # Signing gate: warns while no certificate is configured; fails the build
      # the moment WIN_CSC_LINK exists and the installer is still unsigned.
      - name: Enforce desktop signing gate
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$WIN_CSC_LINK" ]; then
            node scripts/check-desktop-signing.mjs --require
          else
            node scripts/check-desktop-signing.mjs
          fi

      - name: Verify update metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f release/latest.yml
          echo "latest.yml present for electron-updater"
          ls -la release/*.yml release/*.exe release/*.blockmap || true

      - name: Upload GitHub Release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Desktop ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror installer to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          EXE=$(ls release/Luminara-Suite-Setup-*.exe | head -n 1)
          test -n "$EXE"
          node scripts/mirror-desktop-r2.mjs --exe "$EXE"
