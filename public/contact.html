  <link rel="canonical" href="https://www.luminarasuite.com/contact">

<body>
  <main>
    <h1>Contact</h1>
    
    <p>Email <a href="mailto:info@luminara.digital">info@luminara.digital</a>. There is no phone line.</p>
    <form action="mailto:info@luminara.digital" method="post" enctype="text/plain">
      <p><label>Your email<br><input name="email" type="email" required autocomplete="email"></label></p>
      <p><label>Message<br><textarea name="message" required rows="6"></textarea></label></p>
      <p><button type="submit">Email support</button></p>
    </form>
    <h2>Refunds and cancellation</h2>
    <p>A paid plan lasts 30 days and does not renew, so there is nothing to cancel. For a refund, email info@luminara.digital. Australian Consumer Law still applies.</p>

    <p><a href="/faq">FAQ</a> · <a href="/contact">Contact</a> · <a href="/how-it-works">How Luminara works</a> · <a href="/pricing">Pricing</a></p>
  </main>
